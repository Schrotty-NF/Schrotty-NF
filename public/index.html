<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schrotty-NF Verwaltung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Schrotty-NF</h1>
    <nav>
      <a href="#uebersicht" data-tab="uebersicht">Übersicht</a>
      <a href="#auftraege" data-tab="auftraege">Aufträge</a>
      <a href="#ankaeufe" data-tab="ankaeufe">Ankäufe</a>
      <a href="#kunden" data-tab="kunden">Kunden</a>
      <a href="#materialien" data-tab="materialien">Materialpreise</a>
      <a href="#benutzer" data-tab="benutzer">Benutzer</a>
    </nav>
    <div id="sitzung" hidden>
      <span id="angemeldet-als" class="klein"></span>
      <button type="button" id="abmelden" class="zweitrangig klein">Abmelden</button>
    </div>
  </header>

  <main id="inhalt"></main>

  <section id="login" hidden>
    <form id="login-form" class="login-karte">
      <h2 id="login-titel">Anmelden</h2>
      <p id="login-hinweis" class="klein" hidden>Willkommen! Lege jetzt den ersten Zugang an. Damit kannst du dich künftig anmelden und weitere Benutzer hinzufügen.</p>
      <div class="feld"><label for="login-name">Benutzername</label><input id="login-name" name="name" autocomplete="username" required></div>
      <div class="feld"><label for="login-passwort">Passwort</label><input id="login-passwort" name="passwort" type="password" autocomplete="current-password" required></div>
      <div class="feld" id="login-wdh-feld" hidden><label for="login-wdh">Passwort wiederholen</label><input id="login-wdh" name="wdh" type="password" autocomplete="new-password"></div>
      <p id="login-fehler" class="fehler" hidden></p>
      <div class="knoepfe"><button type="submit" id="login-knopf">Anmelden</button></div>
    </form>
  </section>

  <dialog id="dialog">
    <form id="dialog-form" method="dialog">
      <h2 id="dialog-titel"></h2>
      <div id="dialog-felder"></div>
      <p id="dialog-fehler" class="fehler" hidden></p>
      <div class="knoepfe">
        <button type="button" id="dialog-abbrechen" class="zweitrangig">Abbrechen</button>
        <button type="submit">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="meldung" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
